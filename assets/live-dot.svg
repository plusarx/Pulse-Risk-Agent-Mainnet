<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="live">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <circle cx="12" cy="12" r="6" fill="#f0b90b" opacity="0.35">
    <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0;0.55" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="12" r="5.5" fill="#f0b90b" filter="url(#glow)" opacity="0.9"/>
  <circle cx="12" cy="12" r="4.5" fill="#f0b90b"/>
  <circle cx="10.6" cy="10.6" r="1.4" fill="#fde68a" opacity="0.8"/>
</svg>
