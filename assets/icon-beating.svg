<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-4 -4 40 40" role="img" aria-label="Pulse Risk logo">
  <!-- soft glow ring that swells with each beat -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="none" stroke="#f0b90b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="1.4s" repeatCount="indefinite" keyTimes="0;0.12;0.5;1" values="0;0.55;0;0"/>
    <animate attributeName="stroke-width" dur="1.4s" repeatCount="indefinite" keyTimes="0;0.12;0.5;1" values="1;3.5;6;1"/>
  </rect>
  <!-- the logo, beating: a quick "lub-dub" every 1.4 s, scaled around its centre -->
  <g transform="translate(16 16)">
    <g>
      <animateTransform attributeName="transform" type="scale" dur="1.4s" repeatCount="indefinite"
        keyTimes="0;0.12;0.24;0.38;0.52;1" values="1;1.13;1;1.09;1;1"/>
      <g transform="translate(-16 -16)">
        <rect width="32" height="32" rx="8" fill="#f0b90b"/>
        <path d="M4 17h6l2.5-6 4 12 3-9 2 3H28" fill="none" stroke="#0b0d12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
