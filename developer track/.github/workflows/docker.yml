# Builds the app and agent images, pushes them to GitHub Container Registry, then deploys to the Lightsail VM.
#   ghcr.io/<owner>/bnb-hackathon-app:{latest,sha-<short>}
#   ghcr.io/<owner>/bnb-hackathon-agent:{latest,sha-<short>}
#
# Repository Variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_BSC_RPC_URL, NEXT_PUBLIC_ETH_RPC_URL, NEXT_PUBLIC_ARB_RPC_URL, NEXT_PUBLIC_SEPOLIA_RPC_URL
#     baked into the browser bundle at build time.
# Repository Secrets (Settings → Secrets and variables → Actions → Secrets), used by the deploy job:
#   LIGHTSAIL_HOST          static IP or hostname of the VM
#   LIGHTSAIL_USER          SSH user (optional, default "ubuntu")
#   LIGHTSAIL_SSH_KEY       full contents of the Lightsail .pem private key
#   LIGHTSAIL_KNOWN_HOSTS   optional `ssh-keyscan <host>` output; without it the host key is trusted on first use
# The VM needs ~/pulsarx/.env and ~/pulsarx/agent.env in place (see README → Deploy).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bnb-hackathon-app
            dockerfile: Dockerfile
          - name: bnb-hackathon-agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BSC_RPC_URL=${{ vars.NEXT_PUBLIC_BSC_RPC_URL }}
            NEXT_PUBLIC_ETH_RPC_URL=${{ vars.NEXT_PUBLIC_ETH_RPC_URL }}
            NEXT_PUBLIC_ARB_RPC_URL=${{ vars.NEXT_PUBLIC_ARB_RPC_URL }}
            NEXT_PUBLIC_SEPOLIA_RPC_URL=${{ vars.NEXT_PUBLIC_SEPOLIA_RPC_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: lightsail-deploy, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "::error::LIGHTSAIL_HOST secret is not set"; exit 1; }
          test -n "$SSH_KEY" || { echo "::error::LIGHTSAIL_SSH_KEY secret is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lightsail && chmod 600 ~/.ssh/lightsail
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -T 15 "$HOST" > ~/.ssh/known_hosts; fi

      - name: Pull and restart on the VM
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          SSH="ssh -i $HOME/.ssh/lightsail -o BatchMode=yes $SSH_USER@$HOST"
          $SSH 'mkdir -p ~/pulsarx && cd ~/pulsarx && if [ -f docker-compose.yml ] && ! grep -q "^name: bnb-hackathon" docker-compose.yml; then mv docker-compose.yml docker-compose.pulsarxbnb-portfolio.yml; fi'
          scp -i ~/.ssh/lightsail -o BatchMode=yes deploy/docker-compose.yml "$SSH_USER@$HOST:pulsarx/docker-compose.yml"
          # The token is only valid for this job; log out again so nothing stale is left on the VM.
          printf '%s' "$GHCR_TOKEN" | $SSH "set -euo pipefail
            cd ~/pulsarx
            for f in .env agent.env; do test -f \$f || { echo \"missing ~/pulsarx/\$f\" >&2; exit 1; }; done
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            export REGISTRY='$REGISTRY' TAG='$TAG'
            docker compose pull
            docker logout ghcr.io
            # Retire the old pulsarxbnb-portfolio stack (compose project pulsarx). Its volumes are kept.
            docker ps -aq --filter label=com.docker.compose.project=pulsarx | xargs -r docker rm -f
            docker network rm pulsarx_default 2>/dev/null || true
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps"

      - name: Health check
        run: |
          DOMAIN=$(ssh -i ~/.ssh/lightsail -o BatchMode=yes "$SSH_USER@$HOST" "grep -E '^DOMAIN=' ~/pulsarx/.env | cut -d= -f2- | tr -d '\"' | cut -d' ' -f1")
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::https://$DOMAIN/api/health did not come up"; exit 1
