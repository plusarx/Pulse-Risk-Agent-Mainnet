# Builds the living-brain app and agent images and pushes them to GitHub Container Registry. BUILD ONLY: there is no deploy job,
# so this can never redeploy the live site. The images are started by hand on the VM (deploy/second-site/README.md).
#   ghcr.io/<owner>/living-brain-app:{latest,sha-<short>}
#   ghcr.io/<owner>/living-brain-agent:{latest,sha-<short>}
#
# Repository Variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_BSC_RPC_URL, NEXT_PUBLIC_ETH_RPC_URL, NEXT_PUBLIC_ARB_RPC_URL, NEXT_PUBLIC_SEPOLIA_RPC_URL
#     baked into the browser bundle at build time.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: living-brain-app
            dockerfile: Dockerfile
          - name: living-brain-agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BSC_RPC_URL=${{ vars.NEXT_PUBLIC_BSC_RPC_URL }}
            NEXT_PUBLIC_ETH_RPC_URL=${{ vars.NEXT_PUBLIC_ETH_RPC_URL }}
            NEXT_PUBLIC_ARB_RPC_URL=${{ vars.NEXT_PUBLIC_ARB_RPC_URL }}
            NEXT_PUBLIC_SEPOLIA_RPC_URL=${{ vars.NEXT_PUBLIC_SEPOLIA_RPC_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
